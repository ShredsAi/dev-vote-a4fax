# Production profile configuration
spring:
  # Production database configuration with environment variables
  datasource:
    url: jdbc:postgresql://timescaledb-prod:5432/voting_aggregation
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  # JPA configuration for production
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
  
  # Kafka configuration for production
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    consumer:
      max-poll-records: 500
      fetch-min-size: 1024
      fetch-max-wait: 500
      session-timeout: 30000
      heartbeat-interval: 10000
    producer:
      batch-size: 16384
      linger-ms: 5
      compression-type: snappy
      buffer-memory: 33554432

# Production logging configuration
logging:
  level:
    root: WARN
    ai.shreds.aggregation: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
  file:
    name: /var/log/aggregation/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Production management and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
          step: 60s
  metrics:
    export:
      prometheus:
        enabled: true

# Production security settings
security:
  require-ssl: true
  headers:
    frame: DENY
    content-type: nosniff
    xss: block

# Production server settings
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000